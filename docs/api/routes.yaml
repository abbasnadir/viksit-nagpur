openapi: 3.0.3
info:
  title: Nagpur Traffic AI Backend API
  description: Production-grade API routes.
  version: 1.0.0
paths:
  /health:
    get:
      summary: Health check endpoint for container probes.
      tags:
        - Health
      responses:
        '200':
          description: OK
  /api/v1/traffic/flow:
    get:
      summary: Fetches real-time textual traffic flow data using TomTom API. (Opted-out of Authorization)
      tags:
        - Traffic
      parameters:
        - in: query
          name: lat
          schema:
            type: number
          required: true
        - in: query
          name: lng
          schema:
            type: number
          required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      current_speed:
                        type: number
                      free_flow_speed:
                        type: number
                      current_travel_time:
                        type: integer
                      free_flow_travel_time:
                        type: integer
                      confidence:
                        type: number
                      road_closure:
                        type: boolean
                      congestion_ratio:
                        type: number
                      congestion_level:
                        type: string
  /api/v1/traffic/route:
    post:
      summary: Computes route and traffic-aware travel time using Google Routes API. (Opted-out of Authorization)
      tags:
        - Traffic
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - origin_lat
                - origin_lng
                - dest_lat
                - dest_lng
              properties:
                origin_lat:
                  type: number
                origin_lng:
                  type: number
                dest_lat:
                  type: number
                dest_lng:
                  type: number
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      distance_meters:
                        type: integer
                      duration_seconds:
                        type: integer
                      traffic_duration_seconds:
                        type: integer
                      polyline:
                        type: string

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
